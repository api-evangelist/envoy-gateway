apis:
  - aid: envoy-gateway:envoy-gateway
    name: Envoy Gateway
    description: >-
      Envoy Gateway's configuration API is a set of Kubernetes Custom Resource Definitions
      in the gateway.envoyproxy.io/v1alpha1 group — Backend, BackendTrafficPolicy,
      ClientTrafficPolicy, EnvoyExtensionPolicy, EnvoyPatchPolicy, EnvoyProxy,
      HTTPRouteFilter and SecurityPolicy — each carrying a full openAPIV3Schema, 4,080
      schema properties in total. Every policy attaches to an upstream Gateway API object
      through targetRefs. Requests go to the cluster's own Kubernetes API server, so the
      base URL is templated on the operator's cluster rather than fixed by the project.
    humanURL: https://gateway.envoyproxy.io/
    baseURL: https://{kubernetes-api-server}/apis/gateway.envoyproxy.io/v1alpha1
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/envoy-gateway.png
    tags:
      - API Gateway
      - Kubernetes
      - CNCF
      - Gateway API
    properties:
      - type: Documentation
        url: https://gateway.envoyproxy.io/docs/
      - type: GettingStarted
        url: https://gateway.envoyproxy.io/docs/tasks/quickstart/
      - type: APIReference
        url: https://gateway.envoyproxy.io/docs/api/extension_types/
      - type: GitHubRepository
        url: https://github.com/envoyproxy/gateway
      - type: JSONSchema
        url: json-schema/envoy-gateway-crds.yaml
      - type: JSONSchema
        url: json-schema/envoy-gateway-json-schema.yml
      - type: Conformance
        url: conformance/envoy-gateway-gateway-api-v1.6-conformance-report.yaml
  - aid: envoy-gateway:envoy-gateway-extension-server
    name: Envoy Gateway Extension Server
    description: >-
      A gRPC contract an operator implements to extend Envoy Gateway. Envoy Gateway is the
      client: during xDS translation it calls the six EnvoyGatewayExtension RPCs —
      PostRouteModify, PostVirtualHostModify, PostHTTPListenerModify, PostClusterModify,
      PostEndpointsModify and PostTranslateModify — so the extension can modify generated
      Envoy routes, virtual hosts, listeners, clusters, endpoints and the full translated
      output before it reaches the proxies. Messages are typed against Envoy's own v3
      config protos, pinned to buf.build/envoyproxy/envoy:v1.33.0.
    humanURL: https://gateway.envoyproxy.io/docs/tasks/extensibility/extension-server/
    baseURL: https://{extension-server-host}:{port}
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/envoy-gateway.png
    tags:
      - gRPC
      - Extensibility
      - xDS
    properties:
      - type: Documentation
        url: https://gateway.envoyproxy.io/docs/tasks/extensibility/extension-server/
      - type: Protobuf
        url: grpc/envoy-gateway-extension-service.proto
      - type: Protobuf
        url: grpc/envoy-gateway-extension-context.proto
  - aid: envoy-gateway:envoy-gateway-remote-infrastructure
    name: Envoy Gateway Remote Infrastructure Provider
    description: >-
      A gRPC contract added in v1.9.0 that lets an operator supply their own
      infrastructure management strategy in place of Envoy Gateway creating Kubernetes
      workloads itself. Four RPCs on EnvoyGatewayRemoteInfrastructureProvider reconcile
      and tear down the proxy and the global rate limit data planes from an Infra
      intermediate representation.
    humanURL: https://gateway.envoyproxy.io/news/releases/notes/
    baseURL: https://{remote-infra-provider-host}:{port}
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/envoy-gateway.png
    tags:
      - gRPC
      - Infrastructure
    properties:
      - type: Protobuf
        url: grpc/envoy-gateway-remoteinfra-service.proto
