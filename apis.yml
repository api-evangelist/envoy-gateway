aid: envoy-gateway
name: Envoy Gateway
description: >-
  Envoy Gateway is a CNCF project that manages Envoy Proxy as a standalone or
  Kubernetes-based application gateway. It implements the Kubernetes Gateway API and
  extends it with its own API group, gateway.envoyproxy.io, whose eight Custom Resource
  Definitions cover infrastructure shape, client and backend traffic behaviour, security
  policy, extensibility and direct xDS patching. There is no REST API and no hosted
  endpoint: the machine-readable contract is the CRD structural schemas plus two
  first-party gRPC services — an extension server hook and a remote infrastructure
  provider — that Envoy Gateway calls out to. Apache-2.0 licensed and free, with a
  published compatibility matrix giving every release a dated end of life, and Gateway
  API v1.6.1 core and extended conformance certified by report in the standard body's own
  repository.
