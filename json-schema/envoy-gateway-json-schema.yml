description: >-
  Envoy Gateway does not expose a REST API of its own. Its user-facing API is a set of
  Kubernetes Custom Resource Definitions in the gateway.envoyproxy.io API group, each
  carrying a full structural `openAPIV3Schema` generated by controller-gen. That schema
  is the machine-readable contract: it is what the Kubernetes API server validates
  submitted manifests against, and what any client, GitOps tool or agent reads to know
  the shape of an Envoy Gateway resource. This index catalogues the eight CRDs shipped
  in the v1.9.1 release bundle.
