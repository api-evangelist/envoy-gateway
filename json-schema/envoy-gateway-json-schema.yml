notes:
  - >-
    Every resource is Namespaced and every schema is served and is the storage version
    at v1alpha1; Envoy Gateway has not yet promoted its own API group past alpha, which
    is a real and readable stability signal for an integrator.
  - >-
    The Gateway API resources Envoy Gateway implements (GatewayClass, Gateway, HTTPRoute,
    GRPCRoute, TLSRoute, TCPRoute, UDPRoute, ReferenceGrant, BackendTLSPolicy, ListenerSet)
    are NOT catalogued here — they are published by the upstream Kubernetes SIG-Network
    Gateway API project, not by Envoy Gateway, and attributing them to this provider would
    misstate authorship. Envoy Gateway's conformance against them is recorded in
    conformance/envoy-gateway-conformance.yml.
schemas:
  - kind: Backend
    plural: backends
    shortNames: [be]
    scope: Namespaced
    version: v1alpha1
    schemaProperties: 47
    description: >-
      Configures the endpoints of a backend and the behaviour of the connection from
      Envoy Proxy to it, including endpoints of type FQDN, IP, Unix socket and
      DynamicResolver, plus per-backend TLS and application protocol settings.
    docs: https://gateway.envoyproxy.io/docs/api/extension_types/#backend
  - kind: BackendTrafficPolicy
    plural: backendtrafficpolicies
    shortNames: [btp]
    scope: Namespaced
    version: v1alpha1
    schemaProperties: 415
    description: >-
      Traffic behaviour toward a backend — load balancing, global and local rate limiting,
      circuit breaking, retries, health checking, connection settings, compression,
      response override, fault injection and per-policy telemetry.
    docs: https://gateway.envoyproxy.io/docs/api/extension_types/#backendtrafficpolicy
  - kind: ClientTrafficPolicy
    plural: clienttrafficpolicies
    shortNames: [ctp]
    scope: Namespaced
    version: v1alpha1
    schemaProperties: 197
    description: >-
      Traffic behaviour from the downstream client to the Gateway listener — TLS
      termination and client certificate validation, HTTP/1, HTTP/2 and HTTP/3 settings,
      client IP detection (XFF, PROXY protocol, direct source IP), header handling,
      timeouts and connection limits.
    docs: https://gateway.envoyproxy.io/docs/api/extension_types/#clienttrafficpolicy
  - kind: EnvoyExtensionPolicy
    plural: envoyextensionpolicies
    shortNames: [eep]
    scope: Namespaced
    version: v1alpha1
    schemaProperties: 280
    description: >-
      Attaches extension filters to the request path — WebAssembly modules (HTTP and OCI
      image sourced), external processing (ExtProc) services, and Lua scripts.
    docs: https://gateway.envoyproxy.io/docs/api/extension_types/#envoyextensionpolicy
  - kind: EnvoyPatchPolicy
    plural: envoypatchpolicies
    shortNames: [epp]
    scope: Namespaced
    version: v1alpha1
    schemaProperties: 36
    description: >-
      Applies JSON Patch operations directly to the xDS configuration Envoy Gateway
      generates — the documented escape hatch for Envoy features the CRDs do not model.
    docs: https://gateway.envoyproxy.io/docs/api/extension_types/#envoypatchpolicy
  - kind: EnvoyProxy
    plural: envoyproxies
    shortNames: [eproxy]
    scope: Namespaced
    version: v1alpha1
    schemaProperties: 2169
    description: >-
      Infrastructure and runtime configuration of the managed Envoy Proxy fleet —
      Kubernetes Deployment/DaemonSet/Service/HPA/PDB shape, bootstrap override,
      telemetry (access logs, metrics, tracing), shutdown behaviour, filter ordering and
      backend TLS. The largest schema in the group by an order of magnitude.
    docs: https://gateway.envoyproxy.io/docs/api/extension_types/#envoyproxy
  - kind: HTTPRouteFilter
    plural: httproutefilters
    shortNames: [hrf]
    scope: Namespaced
    version: v1alpha1
    schemaProperties: 49
    description: >-
      Envoy Gateway's implementation-specific HTTPRoute filter, referenced from a Gateway
      API HTTPRoute or GRPCRoute rule via extensionRef — URL rewrite with regex captures,
      direct response, credential injection and cookie-based matching.
    docs: https://gateway.envoyproxy.io/docs/api/extension_types/#httproutefilter
  - kind: SecurityPolicy
    plural: securitypolicies
    shortNames: [sp]
    scope: Namespaced
    version: v1alpha1
    schemaProperties: 887
    description: >-
      Authentication and authorization at the gateway — JWT validation, OIDC login,
      OAuth2, API key auth, Basic auth, mutual TLS, external authorization, CORS, CSRF
      and CEL-expression authorization rules.
    docs: https://gateway.envoyproxy.io/docs/api/extension_types/#securitypolicy
