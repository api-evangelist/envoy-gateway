specification: API Commons Lifecycle
specificationVersion: '0.1'
provider: Envoy Gateway
providerId: envoy-gateway
generated: '2026-09-07'
method: searched
source: >-
  https://gateway.envoyproxy.io/news/releases/matrix/ (the project's published
  Compatibility Matrix, read 2026-09-07, HTTP 200) plus
  https://gateway.envoyproxy.io/community/releasing/ and the dated release-note fragments
  under https://github.com/envoyproxy/gateway/tree/main/release-notes.
description: >-
  Envoy Gateway publishes something most providers in this catalogue do not: a dated
  end-of-life for every minor version, in a table, on its own site. An operator can read
  the exact day their release stops receiving patches before they adopt it. Versioning is
  semantic, the API group is still v1alpha1, and deprecations are announced in a dedicated
  section of each release's notes.
versioning:
  scheme: semver
  currentVersion: v1.9.1
  currentVersionReleased: '2026-08-28'
  apiGroup: gateway.envoyproxy.io
  apiVersion: v1alpha1
  apiStability: alpha
  note: >-
    The release train is at v1.9 but the CRD API group is still v1alpha1 and has been
    since v0.2. Kubernetes convention treats v1alpha1 as removable without a deprecation
    period; in practice Envoy Gateway announces CRD-shape changes as breaking changes in
    release notes and has not removed the version. The gap between a 1.x product version
    and an alpha API version is real and worth an integrator's attention.
  minorCadence: >-
    Roughly quarterly. v1.6 2026-02, v1.7 2026-05 (approx), v1.8 2026-05-13, v1.9 2026-08-15.
  patchPolicy: >-
    Security fixes are merged into every supported, non-EOL release branch as patch
    releases. Two branches were patched the same day on 2026-08-28 (v1.9.1 and v1.8.4).
deprecation:
  policy: >-
    Each release's notes carry dedicated "breaking changes" and "deprecations" sections.
    Fields are deprecated with a named replacement and removed in a later release rather
    than at once — v1.9.0 disabled Lua EnvoyExtensionPolicies by default, added an
    `enableLua` field, and deprecated `disableLua` with the note that it "will be removed
    in a future release".
  headers: null
  headersNote: >-
    RFC 8594 Sunset and Deprecation response headers are not applicable. Envoy Gateway is
    a control plane an operator installs, not a hosted HTTP API that could emit lifecycle
    headers on a response. Deprecation is communicated through release notes and the
    compatibility matrix.
  announcementChannels:
    - https://gateway.envoyproxy.io/news/releases/
    - https://github.com/envoyproxy/gateway/releases
    - https://groups.google.com/g/envoy-gateway-announce
  examples:
    - item: BackendTrafficPolicy `disableLua`
      status: deprecated
      replacement: extensionApis.enableLua
      announcedIn: v1.9.0
      note: Deprecated with an explicit statement that it will be removed in a future release.
    - item: HTTPRoute `sessionPersistence.idleTimeout`
      status: removed upstream
      announcedIn: v1.9.0
      note: >-
        Removed from the Gateway API v1.6 HTTPRoute spec. Envoy Gateway stopped validating
        it; manifests setting it must drop the field before the CRD upgrade.
support:
  model: >-
    Community open source. Support is the CNCF project's mailing list, Slack and GitHub
    issues; there is no commercial SLA from the project itself, and no status page,
    because there is no hosted service to have uptime.
  sla: none
  statusPage: null
  statusPageNote: >-
    Envoy Gateway runs in the operator's own cluster. There is nothing for the project to
    report availability on, so no StatusPage pointer is wired.
  channels:
    - https://github.com/envoyproxy/gateway/issues
    - https://www.envoyproxy.io/slack
    - https://groups.google.com/g/envoy-gateway-announce
releaseMatrix:
