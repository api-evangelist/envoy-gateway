source: >-
  https://gateway.envoyproxy.io/ and https://gateway.envoyproxy.io/docs/ — the project
  site has no pricing page. https://gateway.envoyproxy.io/pricing/ returns 404. The
  licence is Apache-2.0 (https://github.com/envoyproxy/gateway/blob/main/LICENSE) and the
  project is governed by the CNCF.
tags:
  - API Gateway
