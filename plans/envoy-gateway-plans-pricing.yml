notes:
  - >-
    CORRECTION. Until this pass, this file carried three fabricated tiers — a Free tier
    with a 1,000 request/month quota, a Professional tier with 100,000 requests/month and
    "price: TBD", and an Enterprise tier with a negotiated SLA and a named account manager.
    None of it existed. It was written by the 2026-05-04 bulk scaffold sweep (roadmap#35)
    and described a generic SaaS API product that Envoy Gateway is not. It has been
    replaced with the measured result.
  - >-
    Commercial support for Envoy Gateway is available from vendors in the ecosystem
    (Tetrate among them). That is those companies' commercial offering, not this project's,
    and it is deliberately not recorded as an Envoy Gateway plan.
  - >-
    accessModel in apis.yml has been corrected from `freemium` to `free` for the same
    reason, and deliveryModel from open_source:false to open_source:true.
