description: >-
  Envoy Gateway has no plans and no prices, and that is the finished answer rather than a
  gap. It is Apache-2.0 software distributed as a Helm chart and a container image, run by
  the operator on their own infrastructure. There is no hosted service to meter, no
  account to hold a tier, and no commercial edition sold by the project.
