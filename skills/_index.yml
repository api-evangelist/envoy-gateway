  Agent Skills published by Envoy Gateway itself. The project keeps one skill, aimed at
  contributors rather than at API consumers: it encodes the maintainers' pull-request
  review checklist so an agent reviewing a change applies the project's own API,
  implementation, test-coverage and release-note conventions.
