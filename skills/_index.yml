notes:
  - >-
    No consumer-facing skills were generated for this provider. The pipeline generates
    skills only when there is an OpenAPI whose operationIds can ground them; Envoy
    Gateway's surface is Kubernetes CRDs and two gRPC extension hooks, so a generated
    "call this operation" skill would have no operationIds to cite and would be invention.
