specification: API Commons Well-Known Index
specificationVersion: '0.1'
provider: Envoy Gateway
providerId: envoy-gateway
generated: '2026-09-07'
method: probed
source: >-
  Live unauthenticated GET of each /.well-known/ path against every host this record
  knows — the documentation host, the parent project site, and the registrable domain.
description: >-
  A record of an absence. Envoy Gateway serves no /.well-known/ documents on any host it
  controls. Every path below was fetched and every one missed. No WellKnown or SecurityTxt
  pointer is wired into apis.yml as a result: the pointer would assert a surface the
  project does not publish. This is a genuine gap the project could close — the
  vulnerability disclosure policy it already maintains in SECURITY.md is exactly what a
  /.well-known/security.txt on gateway.envoyproxy.io would carry.
notes:
  - >-
    gateway.envoyproxy.io and www.envoyproxy.io are Hugo sites on Netlify; both answer
    404 with an HTML body, not a 200 SPA shell, so these are true misses rather than
    catch-all false positives.
  - >-
    The apex envoyproxy.io answers 301 to www.envoyproxy.io for every path; following the
    redirect lands on the same 404s recorded for www.
